[project]
name = "anpr-track"
version = "0.1.0"
description = "ANPR tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.115",
    "pyyaml>=6.0",
    "paddleocr>=2.7,<3",
    "paddlepaddle>=2.6,<3",
]

[project.scripts]
anpr = "anpr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anpr"]

[tool.uv]
package = true
